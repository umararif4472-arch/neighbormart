name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # One fixed debug keystore for every CI build, so the APK signing
      # SHA-1 never changes and Firebase/Google Sign-In keeps working
      # (the fingerprint is registered in the Firebase console).
      - name: Install fixed debug keystore
        run: |
          mkdir -p "$HOME/.android"
          cp android/debug.keystore "$HOME/.android/debug.keystore"

      # Diagnostic: prove which keystore CI actually has, and (after
      # the build) which certificate the APK really carries.
      - name: Show signing keystore fingerprint
        run: |
          keytool -list -v -keystore android/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep "SHA1:" || echo "repo keystore unreadable"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --dart-define=SKIP_GOLDENS=true

      - name: Build release APK
        run: flutter build apk --release

      - name: Show APK signer fingerprint
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-1 digest" || echo "apksigner unavailable"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neighbormart-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
