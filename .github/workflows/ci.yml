name: CI

# Phase 8: every PR (and every push to main) must pass lint, typecheck,
# tests and a production build before it can land. The Flutter job does
# the same for the mobile app (analyze + tests).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  flutter:
    name: Flutter — analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test --dart-define=SKIP_GOLDENS=true
        working-directory: mobile
