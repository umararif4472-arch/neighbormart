name: CI

# Phase 8: every PR (and every push to main) must pass lint, typecheck,
# tests and a production build before it can land. The Flutter job does
# the same for the mobile app (analyze + tests).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rules:
    name: Firestore rules — emulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Firestore emulator is a Java program (firebase-tools
      # 15.35.0, pinned via package.json + package-lock.json); the
      # rules suites require JDK 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      # Both suites hardcode the Firestore emulator at 127.0.0.1:8080
      # and project demo-neighbormart — the ports in firebase.json and
      # the --project flag here must match them. They run in one
      # emulator session, REST first: scripts/rules-test.mjs calls
      # clearFirestore() on start, so it gets a clean database even
      # though the REST suite ran before it.
      - run: npx firebase emulators:exec --only firestore,auth --project demo-neighbormart "npm run test:rules && node scripts/rules-test.mjs"

  flutter:
    name: Flutter — analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test --dart-define=SKIP_GOLDENS=true
        working-directory: mobile
