<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — NeighborMart</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6ebdd;
        color: #3a2218;
        font-family: 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .mark {
        width: 72px;
        height: 72px;
        display: block;
      }
      h1 {
        font-family: Poppins, Georgia, 'Trebuchet MS', sans-serif;
        font-size: 28px;
        margin: 8px 0 0;
      }
      p {
        color: #71604e;
        line-height: 1.55;
        margin: 0;
      }
      button {
        margin-top: 10px;
        border: 0;
        border-radius: 999px;
        background: #a44b2d;
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        padding: 12px 26px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Open Door logo (brand kit: logo-symbol.svg, inlined verbatim) -->
      <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#A44B2D" />
        <g>
          <path d="M146 372 V226 A110 110 0 0 1 366 226 V372 Z" fill="#F6EBDD" />
          <path d="M176 372 V230 A80 80 0 0 1 336 230 V372 Z" fill="#5E2815" />
          <circle cx="312" cy="316" r="9" fill="#D99A2B" />
          <rect x="126" y="372" width="260" height="22" rx="11" fill="#D99A2B" />
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>
        NeighborMart needs a connection to show live listings near you. Check your internet and try
        again — your neighbors aren't going anywhere.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
