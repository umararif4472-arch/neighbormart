<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#A44B2D" />
    <meta
      name="description"
      content="NeighborMart is your local marketplace: borrow, rent, buy, or sell items, vehicles, properties, and sports arenas near you."
    />
    <title>NeighborMart — borrow, rent, buy & sell near you</title>
    <script>
      // Apply the stored/system theme before first paint (no flash).
      // Mirrors src/utils/theme.ts — keep the key + logic in sync.
      try {
        var pref = localStorage.getItem('neighbormart:theme') || 'system'
        var dark =
          pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
