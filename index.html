<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#A44B2D" />
    <!-- Poppins — the brand display face (wordmark is Poppins Bold). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="NeighborMart — Everything behind the door. Your local marketplace to borrow, rent, buy, or sell items, vehicles, properties, and sports arenas near you."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NeighborMart" />
    <meta property="og:title" content="NeighborMart — Everything behind the door" />
    <meta
      property="og:description"
      content="Everything behind the door: tools, vehicles, homes and sports arenas from people nearby — borrow them free, rent them, or buy them outright."
    />
    <meta property="og:image" content="/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NeighborMart — Everything behind the door" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NeighborMart — Everything behind the door" />
    <meta
      name="twitter:description"
      content="Everything behind the door — your local marketplace for items, vehicles, properties and arenas."
    />
    <meta name="twitter:image" content="/social-preview.png" />
    <meta name="twitter:image:alt" content="NeighborMart — Everything behind the door" />
    <title>NeighborMart — Everything behind the door</title>
    <script>
      // Apply the stored/system theme before first paint (no flash).
      // Mirrors src/utils/theme.ts — keep the key + logic in sync.
      try {
        var pref = localStorage.getItem('neighbormart:theme') || 'system'
        var dark =
          pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
